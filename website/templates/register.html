{% extends 'base.html' %}

{% block content %}
  <h1>Register</h1>
  <form
    method="POST"
    action="{% url 'register' %}"
    class="d-flex flex-column align-items-start gap-3"
  >
    {% csrf_token %}

    {% if form.errors %}
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {% for field in form %}
          {% if field.errors %}
            {{ field.errors }}
          {% endif %}
        {% endfor %}

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
    {% endif %}

    {{ form }}

    <button type="submit" class="btn btn-success">
      Register
    </button>
  </form>
{% endblock %}
